plugins {
    id 'com.android.application'
}

android {
    namespace 'com.forest.survival'
    compileSdk 35

    defaultConfig {
        applicationId 'com.forest.survival'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1'
            ]
        }
    }
}

dependencies {
    implementation project(':core')

    implementation 'com.badlogicgames.gdx:gdx-backend-android:1.13.1'

    implementation 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-armeabi-v7a'
    implementation 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-arm64-v8a'
}
